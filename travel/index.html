function getAllCountryInfo(countryCode) {
  var countryName = "";
  var cities = [];
  var provinces = [];
  
  data.forEach(function(item) {
    if (countryMapping[item.country] === countryCode) {
      countryName = item.country;
      if (cities.indexOf(item.city) === -1) {
        cities.push(item.city);
      }
      if (item.province && provinces.indexOf(item.province) === -1) {
        provinces.push(item.province);
      }
    }
  });
  
  return countryName ? { name: countryName, cities: cities, provinces: provinces } : null;
}

function getCountryInfo(countryCode) {
  var countryName = "";
  var cities = [];
  var provinces = [];
  
  data.forEach(function(item) {
    if (item.country !== "中国" && countryMapping[item.country] === countryCode) {
      countryName = item.country;
      if (cities.indexOf(item.city) === -1) {
        cities.push(item.city);
      }
      if (item.province && provinces.indexOf(item.province) === -1) {
        provinces.push(item.province);
      }
    }
  });
  
  return countryName ? { name: countryName, cities: cities, provinces: provinces } : null;
}

function getChinaProvinceInfo(provinceName) {
  var cities = [];
  data.forEach(function(item) {
    if (item.country === "中国") {
      if (!provinceName || item.province === provinceName) {
        cities.push(item.city);
      }
    }
  });
  
  return provinceName ? { name: provinceName, cities: cities } : null;
}

function makeMapChart() {
  var root = am5.Root.new("mapdiv");

  root._logo.dispose();

  root.setThemes([
    am5themes_Animated.new(root)
  ]);

  var chart = root.container.children.push(am5map.MapChart.new(root, {
    panX: "translateX",
    panY: "translateY",
    projection: am5map.geoMercator(),
    homeGeoPoint: { longitude: 110, latitude: 35 },
    homeZoomLevel: 5
  }));

  var polygonSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {
    geoJSON: am5geodata_worldLow
  }));

  polygonSeries.mapPolygons.template.setAll({
    fill: secondaryColor,
    stroke: am5.color(0xffffff),
    strokeWidth: 1,
    strokeOpacity: 0.5
  });

  polygonSeries.mapPolygons.template.adapters.add("fill", function(fill, target) {
    var dataItem = target.dataItem;
    if (dataItem) {
      var regionId = dataItem.get("id");
      var visitedCountries = [];
      
      data.forEach(function(item) {
        var countryCode = countryMapping[item.country];
        if (countryCode && visitedCountries.indexOf(countryCode) === -1) {
          visitedCountries.push(countryCode);
        }
      });
      
      if (visitedCountries.indexOf(regionId) > -1) {
        return visitedCountryColor;
      }
    }
    return fill;
  });

  polygonSeries.events.on("datavalidated", function () {
    console.log("Map data loaded, checking available regions...");
    
    var allRegionIds = [];
    polygonSeries.mapPolygons.each(function(polygon) {
      var regionId = polygon.dataItem.get("id");
      allRegionIds.push(regionId);
    });
    console.log("地图中所有可用的区域ID:", allRegionIds.sort());
    
    var visitedCountries = [];
    
    data.forEach(function(item) {
      var countryCode = countryMapping[item.country];
      if (countryCode && visitedCountries.indexOf(countryCode) === -1) {
        visitedCountries.push(countryCode);
      }
    });

    console.log("访问过的国家:", visitedCountries);

    var foundRegions = [];
    polygonSeries.mapPolygons.each(function(polygon) {
      var regionId = polygon.dataItem.get("id");
      
      if (visitedCountries.indexOf(regionId) > -1) {
        foundRegions.push(regionId);
        console.log("正在为区域着色:", regionId);
        
        var fillColor = visitedCountryColor;
        
        polygon.set("fill", fillColor);
        polygon.set("fillOpacity", 1);
        
        polygon.states.create("default", {
          fill: fillColor,
          fillOpacity: 1
        });
        
        polygon.states.create("hover", {
          fill: am5.color(0x87ceeb),
          fillOpacity: 1
        });
      }
    });
    
    console.log("成功着色的区域:", foundRegions);
    console.log("访问颜色 - 国家色:", visitedCountryColor.toString());

    chart.goHome();
  });

  pointSeries = chart.series.push(am5map.MapPointSeries.new(root, {
    calculateAggregates: true,
    idField: "city"
  }));

  var circleTemplate = am5.Template.new(root, {});

  pointSeries.bullets.push(function (root, series, dataItem) {
    var container = am5.Container.new(root, {});
    var circle = container.children.push(am5.Circle.new(root, {
      radius: 4,
      fill: mainColor,
      stroke: mainColor,
      strokeWidth: 1,
      strokeOpacity: 0.8,
      fillOpacity: 0.7,
      layer: 30,
      tooltipY: 0
    }, circleTemplate));

    circle.adapters.add("tooltipText", function(text, target) {
      var dataItem = target.dataItem;
      if (dataItem && dataItem.dataContext) {
        var data = dataItem.dataContext;
        var tooltip = "[bold fontSize: 16px]" + data.city + "[/]\n国家: " + data.country;
        if (data.province) {
          tooltip += "\n省份: " + data.province;
        }
        tooltip += "\n访问日期: " + new Date(data.date).toLocaleDateString('zh-CN');
        return tooltip;
      }
      return text;
    });

    circle.states.create("hover", {
      scale: 1.4,
      fillOpacity:1
    });

    circle.events.on("click", function(ev) {
      var dataItem = ev.target.dataItem;
      if (dataItem && dataItem.dataContext.link) {
        window.open(dataItem.dataContext.link, '_blank');
      }
    });

    circle.adapters.add("cursorOverStyle", function(cursor, target) {
      var dataItem = target.dataItem;
      if (dataItem && dataItem.dataContext.link) {
        return "pointer";
      }
      return "default";
    });    


    var label = container.children.push(am5.Label.new(root, {
      text: "{city}",
      fontSize: 13,
      centerY: am5.p50,
      centerX: am5.p100,
      populateText: true,
      layer: 30,
      paddingRight: 4
    }));

    label.adapters.add("dx", function (dy, target) {
      return -circle.get("radius");
    });

    return am5.Bullet.new(root, {
      sprite: container,
      locationX: 0,
      locationY: 0.5
    })
  })

  // 处理数据，将坐标转换为正确的格式
  var processedData = data.map(function(item) {
    return {
      ...item,
      geometry: { 
        type: "Point", 
        coordinates: item.coordinates 
      }
    };
  });

  pointSeries.data.setAll(processedData);

  chart.appear(1000, 100);
}

    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        const iframes = disqus.getElementsByTagName('iframe');
        if (iframes.length > 1) {
          const commentsIframe = iframes[1];
          while (disqus.firstChild) {
            disqus.removeChild(disqus.firstChild);
          }
          disqus.appendChild(commentsIframe);
          observer.disconnect();
        }
      });
    });
    observer.observe(disqus, { childList: true, subtree: true });
  });
</script>
